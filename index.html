<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grade 10 Knowledge Quest</title>
    <link href="https://fonts.googleapis.com/css2?family=Righteous&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --neon-blue: #00f0ff;
            --neon-pink: #ff006e;
            --neon-yellow: #ffbe0b;
            --neon-green: #06ffa5;
            --dark-bg: #0a0e27;
            --card-bg: #1a1f3a;
        }

        body {
            font-family: 'Space Mono', monospace;
            background: var(--dark-bg);
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 240, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 110, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255, 190, 11, 0.08) 0%, transparent 50%);
            animation: bgPulse 15s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes bgPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            position: relative;
        }

        h1 {
            font-family: 'Righteous', cursive;
            font-size: 4rem;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink), var(--neon-yellow));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: titleGlow 3s ease-in-out infinite;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        @keyframes titleGlow {
            0%, 100% { filter: drop-shadow(0 0 20px rgba(0, 240, 255, 0.5)); }
            50% { filter: drop-shadow(0 0 40px rgba(255, 0, 110, 0.8)); }
        }

        .subtitle {
            font-size: 1.2rem;
            color: var(--neon-green);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* Setup Screen */
        .setup-screen {
            max-width: 600px;
            margin: 40px auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 20px;
            border: 2px solid var(--neon-blue);
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3);
        }

        .team-setup {
            margin: 30px 0;
        }

        .team-setup h3 {
            color: var(--neon-yellow);
            margin-bottom: 15px;
            font-size: 1.3rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 15px;
            background: var(--dark-bg);
            border: 2px solid var(--neon-blue);
            border-radius: 10px;
            color: white;
            font-family: 'Space Mono', monospace;
            font-size: 1.1rem;
            margin-bottom: 15px;
            transition: all 0.3s;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--neon-pink);
            box-shadow: 0 0 20px rgba(255, 0, 110, 0.4);
        }

        button {
            background: linear-gradient(135deg, var(--neon-pink), var(--neon-blue));
            border: none;
            padding: 18px 40px;
            border-radius: 50px;
            color: white;
            font-family: 'Righteous', cursive;
            font-size: 1.3rem;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            box-shadow: 0 5px 20px rgba(255, 0, 110, 0.4);
        }

        button:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(255, 0, 110, 0.6);
        }

        button:active {
            transform: translateY(0);
        }

        /* Scoreboard */
        .scoreboard {
            display: flex;
            justify-content: space-around;
            margin: 30px 0;
            gap: 20px;
            flex-wrap: wrap;
        }

        .team-card {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 15px;
            min-width: 250px;
            border: 3px solid var(--neon-blue);
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .team-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .team-card:hover::before {
            left: 100%;
        }

        .team-card.team1 {
            border-color: var(--neon-pink);
        }

        .team-card.team2 {
            border-color: var(--neon-blue);
        }

        .team-card.team3 {
            border-color: var(--neon-green);
        }

        .team-name {
            font-family: 'Righteous', cursive;
            font-size: 1.5rem;
            margin-bottom: 10px;
            color: var(--neon-yellow);
        }

        .team-score {
            font-size: 3rem;
            font-weight: bold;
            color: var(--neon-green);
            text-align: center;
        }

        /* Category Selection */
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 40px 0;
        }

        .category-btn {
            background: var(--card-bg);
            border: 3px solid var(--neon-blue);
            padding: 30px 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }

        .category-btn::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(0, 240, 255, 0.2);
            transform: translate(-50%, -50%);
            transition: width 0.5s, height 0.5s;
        }

        .category-btn:hover::before {
            width: 300px;
            height: 300px;
        }

        .category-btn:hover {
            border-color: var(--neon-pink);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 240, 255, 0.4);
        }

        .category-btn.science { border-color: var(--neon-green); }
        .category-btn.math { border-color: var(--neon-pink); }
        .category-btn.history { border-color: var(--neon-yellow); }
        .category-btn.literature { border-color: var(--neon-blue); }
        .category-btn.geography { border-color: #ff6b35; }
        .category-btn.pop-culture { border-color: #b47aea; }

        .category-name {
            font-family: 'Righteous', cursive;
            font-size: 1.5rem;
            position: relative;
            z-index: 1;
        }

        /* Question Display */
        .question-display {
            background: var(--card-bg);
            padding: 50px;
            border-radius: 20px;
            margin: 40px auto;
            max-width: 900px;
            border: 3px solid var(--neon-pink);
            box-shadow: 0 0 40px rgba(255, 0, 110, 0.3);
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .question-category {
            color: var(--neon-yellow);
            font-size: 1.2rem;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .question-text {
            font-size: 2rem;
            margin-bottom: 40px;
            line-height: 1.5;
            font-weight: bold;
        }

        .answers {
            display: grid;
            gap: 15px;
        }

        .answer-btn {
            background: var(--dark-bg);
            border: 2px solid var(--neon-blue);
            padding: 20px;
            border-radius: 12px;
            text-align: left;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 1.1rem;
        }

        .answer-btn:hover {
            background: rgba(0, 240, 255, 0.1);
            border-color: var(--neon-pink);
            transform: translateX(10px);
        }

        .answer-btn.correct {
            background: rgba(6, 255, 165, 0.2);
            border-color: var(--neon-green);
            animation: correctPulse 0.5s;
        }

        .answer-btn.incorrect {
            background: rgba(255, 0, 110, 0.2);
            border-color: var(--neon-pink);
            animation: shake 0.5s;
        }

        @keyframes correctPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .timer {
            font-size: 3rem;
            text-align: center;
            color: var(--neon-yellow);
            font-family: 'Righteous', cursive;
            margin: 20px 0;
        }

        .timer.warning {
            color: var(--neon-pink);
            animation: timerPulse 0.5s infinite;
        }

        @keyframes timerPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .controls {
            text-align: center;
            margin: 30px 0;
        }

        .controls button {
            margin: 0 10px;
        }

        .hidden {
            display: none;
        }

        /* Winner Screen */
        .winner-screen {
            text-align: center;
            padding: 60px;
            animation: slideIn 0.8s ease-out;
        }

        .winner-screen h2 {
            font-family: 'Righteous', cursive;
            font-size: 4rem;
            background: linear-gradient(135deg, var(--neon-yellow), var(--neon-pink), var(--neon-green));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
            animation: titleGlow 2s ease-in-out infinite;
        }

        .final-scores {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: 40px 0;
            flex-wrap: wrap;
        }

        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: var(--neon-yellow);
            position: absolute;
            animation: confettiFall 3s linear;
        }

        @keyframes confettiFall {
            to {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2.5rem;
            }
            
            .question-text {
                font-size: 1.5rem;
            }
            
            .setup-screen {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Health Quest</h1>
            <p class="subtitle">Grade 10 Health Knowledge Challenge</p>
        </header>

        <!-- Setup Screen -->
        <div id="setupScreen" class="setup-screen">
            <div style="text-align: center;">
                <h3 style="color: var(--neon-yellow); font-size: 1.8rem; margin-bottom: 20px;">Welcome to Health Trivia!</h3>
                <p style="color: var(--neon-green); font-size: 1.2rem; margin-bottom: 30px;">Test your knowledge on what we've learned this year</p>
                <button onclick="startGame()">Start Game</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="gameScreen" class="hidden">
            <div class="scoreboard">
                <div class="team-card">
                    <div class="team-name">Questions Answered</div>
                    <div class="team-score" id="questionsAnswered">0</div>
                </div>
                <div class="team-card team1">
                    <div class="team-name">Correct Answers</div>
                    <div class="team-score" id="correctAnswers">0</div>
                </div>
                <div class="team-card team2">
                    <div class="team-name">Class Score</div>
                    <div class="team-score" id="classPercentage">0%</div>
                </div>
            </div>

            <div id="categorySelect">
                <h2 style="text-align: center; color: var(--neon-yellow); font-family: 'Righteous', cursive; font-size: 2rem; margin-bottom: 30px;">Choose Your Health Topic</h2>
                <div class="categories">
                    <button class="category-btn science" onclick="selectCategory('nutrition')">
                        <div class="category-name">🥗 Nutrition</div>
                    </button>
                    <button class="category-btn math" onclick="selectCategory('mental-health')">
                        <div class="category-name">🧠 Mental Health</div>
                    </button>
                    <button class="category-btn history" onclick="selectCategory('physical-health')">
                        <div class="category-name">💪 Physical Health</div>
                    </button>
                    <button class="category-btn literature" onclick="selectCategory('personal-safety')">
                        <div class="category-name">🛡️ Personal Safety</div>
                    </button>
                    <button class="category-btn geography" onclick="selectCategory('fitness-wellness')">
                        <div class="category-name">🏃 Fitness & Wellness</div>
                    </button>
                    <button class="category-btn pop-culture" onclick="selectCategory('relationships')">
                        <div class="category-name">🤝 Relationships</div>
                    </button>
                </div>
            </div>

            <div id="questionDisplay" class="hidden">
                <div class="timer" id="timer">15</div>
                <div class="question-display">
                    <div class="question-category" id="currentCategory"></div>
                    <div class="question-text" id="questionText"></div>
                    <div class="answers" id="answers"></div>
                </div>
                <div class="controls">
                    <button onclick="nextQuestion()">Next Question</button>
                    <button onclick="endGame()">End Game</button>
                </div>
            </div>
        </div>

        <!-- Winner Screen -->
        <div id="winnerScreen" class="hidden winner-screen">
            <h2>🏆 Game Over! 🏆</h2>
            <div class="final-scores" id="finalScores"></div>
            <button onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        const questions = {
            nutrition: [
                { q: "Which nutrient is the body's main source of energy?", a: ["Proteins", "Carbohydrates", "Fats", "Vitamins"], correct: 1 },
                { q: "What vitamin is produced when skin is exposed to sunlight?", a: ["Vitamin C", "Vitamin A", "Vitamin D", "Vitamin B12"], correct: 2 },
                { q: "Which mineral is essential for strong bones and teeth?", a: ["Calcium", "Iron", "Zinc", "Potassium"], correct: 0 },
                { q: "How many servings of fruits and vegetables should you eat daily?", a: ["3-4 servings", "1-2 servings", "7-10 servings", "15+ servings"], correct: 2 },
                { q: "What is the recommended daily water intake for teenagers?", a: ["2-3 glasses", "5-6 glasses", "15+ glasses", "8-10 glasses"], correct: 3 },
                { q: "Which type of fat is considered 'healthy'?", a: ["Trans fats", "Saturated fats", "Unsaturated fats", "Hydrogenated fats"], correct: 2 },
                { q: "What does BMI stand for?", a: ["Basic Metabolic Indicator", "Body Mass Index", "Body Measurement Index", "Basal Metabolic Input"], correct: 1 },
                { q: "Which food group should make up the largest portion of your plate?", a: ["Grains", "Protein", "Vegetables and fruits", "Dairy"], correct: 2 },
                { q: "What is a complete protein source?", a: ["Foods with carbs only", "Foods with all essential amino acids", "Foods with fiber only", "Foods with vitamins only"], correct: 1 },
                { q: "Which nutrient helps build and repair body tissues?", a: ["Carbohydrates", "Water", "Protein", "Fiber"], correct: 2 }
            ],
            "mental-health": [
                { q: "What is a healthy way to cope with stress?", a: ["Ignoring the problem", "Exercise and talking to someone", "Isolating yourself", "Avoiding all responsibilities"], correct: 1 },
                { q: "How many hours of sleep do teenagers need per night?", a: ["5-6 hours", "4-5 hours", "8-10 hours", "11-12 hours"], correct: 2 },
                { q: "What is a sign of good mental health?", a: ["Never feeling sad", "Always being happy", "Being able to cope with daily stressors", "Never asking for help"], correct: 2 },
                { q: "Which of these is a symptom of anxiety?", a: ["Increased appetite", "Racing heartbeat and worry", "Improved focus", "Sleeping too much"], correct: 1 },
                { q: "What is the first step in managing anger?", a: ["Yelling at someone", "Hitting something", "Recognizing the warning signs", "Keeping it bottled up"], correct: 2 },
                { q: "What does mental health stigma mean?", a: ["Support for mental health", "Negative attitudes about mental illness", "Mental health awareness", "A type of therapy"], correct: 1 },
                { q: "Which activity can improve mental health?", a: ["Constant social media use", "Skipping meals", "Mindfulness and meditation", "Avoiding friends"], correct: 2 },
                { q: "What should you do if you're worried about a friend's mental health?", a: ["Ignore it", "Tell everyone about it", "Talk to them and get adult help", "Wait for them to fix it alone"], correct: 2 },
                { q: "What is resilience?", a: ["Never experiencing problems", "The ability to bounce back from challenges", "Avoiding all stress", "Being physically strong"], correct: 1 },
                { q: "Which is a healthy way to express emotions?", a: ["Suppressing all feelings", "Journaling or talking it out", "Acting out aggressively", "Pretending everything is fine"], correct: 1 }
            ],
            "physical-health": [
                { q: "How many minutes of physical activity should teens get daily?", a: ["30 minutes", "15 minutes", "60 minutes", "120 minutes"], correct: 2 },
                { q: "What is the maximum recommended screen time per day for teens?", a: ["6 hours", "2 hours recreational", "No limit", "30 minutes"], correct: 1 },
                { q: "Which is a benefit of regular exercise?", a: ["Improved mood", "Stronger bones", "Better sleep", "All of the above"], correct: 3 },
                { q: "What is the proper way to prevent sports injuries?", a: ["Skip warming up to save time", "Warm up and stretch before activity", "Only stretch after exercise", "Exercise through pain"], correct: 1 },
                { q: "How often should you wash your hands?", a: ["Once a day", "Before eating and after using restroom", "Only when visibly dirty", "Only after sports"], correct: 1 },
                { q: "What is the FITT principle in fitness?", a: ["Fast, Intense, Tough, Training", "Fitness, Interval, Timed, Test", "Frequency, Intensity, Time, Type", "Fun, Important, Total, Team"], correct: 2 },
                { q: "Which is an example of cardiovascular exercise?", a: ["Stretching", "Running", "Weightlifting", "Yoga"], correct: 1 },
                { q: "What should you do immediately after spraining an ankle?", a: ["Keep walking on it", "Apply heat immediately", "RICE: Rest, Ice, Compression, Elevation", "Ignore it"], correct: 2 },
                { q: "What is good posture important for?", a: ["Looking taller only", "Preventing back and neck pain", "Impressing others", "It's not important"], correct: 1 },
                { q: "How can you protect your hearing?", a: ["Listen to music at max volume", "Limit loud music and use ear protection", "Ignore ear pain", "Clean ears with cotton swabs daily"], correct: 1 }
            ],
            "personal-safety": [
                { q: "What is the emergency number in the UAE?", a: ["911", "999", "112", "100"], correct: 1 },
                { q: "What should you do if you feel unsafe in a situation?", a: ["Stay and handle it alone", "Leave and tell a trusted adult", "Ignore your feelings", "Post about it on social media"], correct: 1 },
                { q: "What is the best way to protect yourself online?", a: ["Share passwords with friends", "Keep personal information private", "Accept all friend requests", "Post your location always"], correct: 1 },
                { q: "What is cybersecurity?", a: ["Having lots of followers", "Protecting information and devices from threats", "Using all social media platforms", "Posting frequently"], correct: 1 },
                { q: "What should you do if someone is bullying you?", a: ["Fight back physically", "Tell a trusted adult immediately", "Keep it to yourself", "Bully them back"], correct: 1 },
                { q: "What is personal hygiene?", a: ["Only showering", "Wearing nice clothes", "Practices that maintain health and cleanliness", "Using perfume"], correct: 2 },
                { q: "How often should you brush your teeth?", a: ["Once a week", "At least twice daily", "Only in the morning", "Only when they feel dirty"], correct: 1 },
                { q: "What is the proper way to wash your hands?", a: ["Quick rinse with water", "5 seconds with soap", "Soap and water for 20 seconds", "Hand sanitizer only"], correct: 2 },
                { q: "What should you do during a fire emergency?", a: ["Hide in a closet", "Stay low and get out quickly", "Take the elevator", "Gather your belongings first"], correct: 1 },
                { q: "What does it mean to be a responsible digital citizen?", a: ["Posting everything you think", "Having the most followers", "Being respectful and safe online", "Spending all day on devices"], correct: 2 }
            ],
            "fitness-wellness": [
                { q: "What are the benefits of regular exercise?", a: ["Stronger muscles", "Better mood", "All of the above", "Improved sleep"], correct: 2 },
                { q: "What does flexibility training help with?", a: ["Building muscle mass", "Range of motion and injury prevention", "Losing weight quickly", "Running faster"], correct: 1 },
                { q: "What is the best time to stretch?", a: ["Before any movement", "After warming up muscles", "Only in the morning", "Never needed"], correct: 1 },
                { q: "How much water should you drink during exercise?", a: ["Only after finishing", "Only if very thirsty", "Before, during, and after activity", "Water isn't important"], correct: 2 },
                { q: "What does cardiovascular fitness improve?", a: ["Only muscle size", "Flexibility only", "Heart and lung health", "Bone density only"], correct: 2 },
                { q: "What is a safe way to increase workout intensity?", a: ["Double it immediately", "Gradually over time", "Push through pain", "Skip rest days"], correct: 1 },
                { q: "Why are rest days important?", a: ["They aren't important", "Only for professional athletes", "Allow muscles to recover and grow", "Sign of weakness"], correct: 2 },
                { q: "What is proper form in exercise?", a: ["Lifting the heaviest weight", "Correct technique to prevent injury", "Going as fast as possible", "Looking good while exercising"], correct: 1 },
                { q: "What is BMI used to measure?", a: ["Athletic ability", "Body weight relative to height", "Muscle mass only", "Daily calorie needs"], correct: 1 },
                { q: "What is a benefit of team sports?", a: ["Social connections", "Physical fitness", "All of the above", "Teamwork skills"], correct: 2 },
                { q: "What should you do if you feel dizzy during exercise?", a: ["Push through it", "Stop and rest immediately", "Exercise harder", "Ignore it"], correct: 1 },
                { q: "What does yoga primarily improve?", a: ["Only muscle strength", "Flexibility and mental calmness", "Running speed", "Weight loss only"], correct: 1 }
            ],
            relationships: [
                { q: "What is active listening?", a: ["Waiting for your turn to talk", "Fully focusing and understanding the speaker", "Thinking about other things while someone talks", "Interrupting with advice"], correct: 1 },
                { q: "What is a healthy boundary in any relationship?", a: ["Sharing all passwords", "Respecting personal space and privacy", "Spending every moment together", "Never disagreeing"], correct: 1 },
                { q: "What is emotional abuse?", a: ["Occasional disagreements", "Manipulation, insults, and control", "Constructive criticism", "Expressing feelings"], correct: 1 },
                { q: "What does 'ghosting' mean in communication?", a: ["Being honest about feelings", "Taking a break", "Suddenly cutting off all communication", "Messaging frequently"], correct: 2 },
                { q: "Which is a sign of a toxic friendship?", a: ["Supporting each other's goals", "Constant criticism and jealousy", "Honest communication", "Spending time apart sometimes"], correct: 1 },
                { q: "What is conflict resolution?", a: ["Winning every argument", "Finding peaceful solutions to disagreements", "Avoiding all conflict", "Letting others decide everything"], correct: 1 },
                { q: "What does empathy mean?", a: ["Agreeing with everyone", "Feeling sorry for people", "Understanding and sharing others' feelings", "Ignoring emotions"], correct: 2 },
                { q: "What is a sign of a healthy friendship?", a: ["Constant competition", "Mutual respect and support", "Controlling each other", "Never spending time apart"], correct: 1 },
                { q: "How should you communicate your feelings?", a: ["Blame the other person", "Use 'I' statements and be clear", "Post on social media instead", "Assume they know"], correct: 1 },
                { q: "What is cyberbullying?", a: ["Friendly online gaming", "Using technology to harass others", "Sharing memes", "Group chats with friends"], correct: 1 }
            ]
        };

        let questionsAnswered = 0;
        let correctAnswers = 0;
        let currentQuestion = null;
        let usedQuestions = {};
        let timerInterval = null;
        let timeLeft = 15;

        function startGame() {
            document.getElementById('setupScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            updateScoreboard();
        }

        function updateScoreboard() {
            document.getElementById('questionsAnswered').textContent = questionsAnswered;
            document.getElementById('correctAnswers').textContent = correctAnswers;
            const percentage = questionsAnswered > 0 ? Math.round((correctAnswers / questionsAnswered) * 100) : 0;
            document.getElementById('classPercentage').textContent = percentage + '%';
        }

        function selectCategory(category) {
            const categoryQuestions = questions[category];
            if (!usedQuestions[category]) usedQuestions[category] = [];
            
            const availableQuestions = categoryQuestions.filter((_, index) => 
                !usedQuestions[category].includes(index)
            );

            if (availableQuestions.length === 0) {
                alert('All questions in this category have been used! Choose another category.');
                return;
            }

            const randomIndex = Math.floor(Math.random() * availableQuestions.length);
            const questionIndex = categoryQuestions.indexOf(availableQuestions[randomIndex]);
            currentQuestion = { ...categoryQuestions[questionIndex], category, index: questionIndex };
            usedQuestions[category].push(questionIndex);

            displayQuestion();
        }

        function displayQuestion() {
            document.getElementById('categorySelect').classList.add('hidden');
            document.getElementById('questionDisplay').classList.remove('hidden');
            
            document.getElementById('currentCategory').textContent = currentQuestion.category.toUpperCase();
            document.getElementById('questionText').textContent = currentQuestion.q;
            
            const answersDiv = document.getElementById('answers');
            answersDiv.innerHTML = currentQuestion.a.map((answer, index) => `
                <button class="answer-btn" onclick="checkAnswer(${index})">${answer}</button>
            `).join('');

            startTimer();
        }

        function startTimer() {
            timeLeft = 15;
            updateTimer();
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimer();
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    checkAnswer(-1); // Time's up, wrong answer
                }
            }, 1000);
        }

        function updateTimer() {
            const timerEl = document.getElementById('timer');
            timerEl.textContent = timeLeft;
            if (timeLeft <= 5) {
                timerEl.classList.add('warning');
            } else {
                timerEl.classList.remove('warning');
            }
        }

        function checkAnswer(selected) {
            clearInterval(timerInterval);
            questionsAnswered++;
            
            const buttons = document.querySelectorAll('.answer-btn');
            buttons.forEach((btn, index) => {
                btn.disabled = true;
                if (index === currentQuestion.correct) {
                    btn.classList.add('correct');
                } else if (index === selected) {
                    btn.classList.add('incorrect');
                }
            });

            if (selected === currentQuestion.correct) {
                correctAnswers++;
            }
            
            updateScoreboard();
        }

        function nextQuestion() {
            document.getElementById('categorySelect').classList.remove('hidden');
            document.getElementById('questionDisplay').classList.add('hidden');
        }

        function endGame() {
            document.getElementById('gameScreen').classList.add('hidden');
            document.getElementById('winnerScreen').classList.remove('hidden');
            
            const percentage = questionsAnswered > 0 ? Math.round((correctAnswers / questionsAnswered) * 100) : 0;
            const finalScoresDiv = document.getElementById('finalScores');
            
            let grade = '';
            let message = '';
            if (percentage >= 90) {
                grade = 'A+';
                message = 'Outstanding! 🌟';
            } else if (percentage >= 80) {
                grade = 'A';
                message = 'Excellent Work! 🎉';
            } else if (percentage >= 70) {
                grade = 'B';
                message = 'Great Job! 👏';
            } else if (percentage >= 60) {
                grade = 'C';
                message = 'Good Effort! 💪';
            } else {
                grade = 'Keep Learning';
                message = 'Practice Makes Perfect! 📚';
            }
            
            finalScoresDiv.innerHTML = `
                <div class="team-card">
                    <div class="team-name">Questions Answered</div>
                    <div class="team-score">${questionsAnswered}</div>
                </div>
                <div class="team-card team1">
                    <div class="team-name">Correct Answers</div>
                    <div class="team-score">${correctAnswers}</div>
                </div>
                <div class="team-card team2">
                    <div class="team-name">Class Score</div>
                    <div class="team-score">${percentage}%</div>
                </div>
                <div class="team-card team3" style="width: 100%; margin-top: 20px;">
                    <div class="team-name">${message}</div>
                    <div class="team-score" style="font-size: 2rem;">${grade}</div>
                </div>
            `;

            createConfetti();
        }

        function createConfetti() {
            const colors = ['var(--neon-blue)', 'var(--neon-pink)', 'var(--neon-yellow)', 'var(--neon-green)'];
            for (let i = 0; i < 50; i++) {
                setTimeout(() => {
                    const confetti = document.createElement('div');
                    confetti.className = 'confetti';
                    confetti.style.left = Math.random() * 100 + '%';
                    confetti.style.background = colors[Math.floor(Math.random() * colors.length)];
                    confetti.style.animationDelay = Math.random() * 2 + 's';
                    document.body.appendChild(confetti);
                    setTimeout(() => confetti.remove(), 3000);
                }, i * 50);
            }
        }
    </script>
</body>
</html>
